name: Deploy Static Website to AWS S3

on:
  push:
    branches:
      - main  # Trigger pipeline on push to main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # --- UNCOMMENT & ADJUST IF USING A BUILD STEP (React, Vue, Vite, etc.) ---
    # - name: Setup Node.js
    #   uses: actions/setup-node@v4
    #   with:
    #     node-version: '20'
    #
    # - name: Install Dependencies & Build
    #   run: |
    #     npm ci
    #     npm run build
    # ------------------------------------------------------------------------

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-2  # Replace with your S3 bucket's AWS region

    - name: Sync files to S3
      run: |
        # Long-lived, immutable cache for everything except HTML: these assets are
        # only ever updated under a new filename or invalidated via CloudFront below,
        # so browsers/CDN can cache them for a year without re-checking.
        # Build sources (build/, content/, package.json, docs) are not part of the site.
        # Filters are applied in order with later ones winning, so the excludes go
        # last, after any --include.
        EXCLUDES=(--exclude ".git/*" --exclude ".github/*" --exclude "build/*" --exclude "content/*" --exclude "infra/*" --exclude "package.json" --exclude "CLAUDE.md" --exclude "README.md" --exclude ".gitignore")
        aws s3 sync ./ s3://ljwebmanagement-website --delete --exclude "*.html" --exclude "assets/data/*" "${EXCLUDES[@]}" --cache-control "public, max-age=31536000, immutable"
        # HTML must-revalidate on every request so page edits go live immediately.
        aws s3 sync ./ s3://ljwebmanagement-website --delete --exclude "*" --include "*.html" "${EXCLUDES[@]}" --cache-control "public, max-age=0, must-revalidate"
        # The site search index is also loaded by blog.ljwebmanagement.com without a
        # version query string, so it gets a short cache instead of an immutable one.
        aws s3 sync ./assets/data s3://ljwebmanagement-website/assets/data --delete --cache-control "public, max-age=3600"
        # If deploying a build folder (e.g. dist/ or build/), change `./` to `./dist`

    - name: Invalidate CloudFront Cache
      run: |
        aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"